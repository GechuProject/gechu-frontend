name: Sync Fork with Public Upstream

on:
  schedule:
    # 예: 매일 한국 시간 오전 0시 실행
    - cron: '0 15 * * *'
  workflow_dispatch: # 테스트용 수동 실행 버튼

jobs:
  sync:
    runs-on: ubuntu-latest
    # 중요: 이 권한 설정이 있어야 개인 레포에 Push가 가능합니다.
    permissions:
      contents: write

    steps:
      - name: Checkout Personal Repo
        uses: actions/checkout@v4
        with:
          ref: develop  # 본인 레포의 기본 브랜치 (master면 수정 필요)
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'yunssu8428-hash'
          git config --global user.email 'yunssu8428@gmail.com'

      - name: Add Upstream Remote
        # 개인 fork → GechuProject 메인 레포에서 동기화
        run: |
          git remote add upstream https://github.com/GechuProject/gechu-frontend.git || true
          git fetch upstream

      - name: Sync Upstream to Local
        # Upstream의 develop을 내 develop으로 병합
        run: |
          git merge upstream/develop --allow-unrelated-histories -m "[chore] sync with upstream organization repo"

      - name: Push to develop
        run: |
          git push origin develop